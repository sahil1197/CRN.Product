version: "3.9"

services:

  crn-product-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: crn-product-api

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=CRNProductDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"

    depends_on:
      - sqlserver

    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: crn-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    restart: unless-stopped

volumes:
  sqlserver-data:
